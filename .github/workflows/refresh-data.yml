name: Refresh Pipeline Data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"
concurrency:
  group: refresh-pipeline-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run pipeline
      - run: npm test && npm run audit:data && npm run build
      - name: Commit validated data and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/raw/*.json public/data/ audit/data-audit.json audit/block-fetch-errors.json
          git diff --cached --quiet || git commit -m "chore: refresh validated Bitcoin data [skip ci]"
          git push
