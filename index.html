  <noscript>
    <h1>Bitcoin Data Driven Geometry</h1>
    <p>150 curated historical days. One tooth per block; individual weight determines tooth length. Gear pairs transaction and fee bars with each block, surrounded by difficulty and estimated-hashrate rim portions. Dots represent active addresses. Atom and Classic offer alternative arrangements of the same observations.</p>
    <p>Missing data is unavailable, not zero. Addresses are not people. Historical events provide context, not proof of cause and effect. Particle positions, motion, and lighting are presentation choices.</p>
    <p>Sources: CoinMetrics, Blockchain.com, mempool.space, and Blockstream for boundary checks. <a href="/data/provenance.json">Data provenance</a>. <a href="https://github.com/vyalya/bitcoin-data-driven-geometry">Repository and methodology</a>.</p>
    <p>This visualization requires JavaScript and WebGL2.</p>
