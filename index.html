    <noscript>
      <h1>The Bitcoin Network as Data Driven Geometry</h1>
      <p>
        An interactive 3D visualization of the Bitcoin network across 105
        historically significant dates — from Genesis (January 3, 2009) through
        the present. Every shape, ring, particle, and block maps to a real
        on-chain metric.
      </p>
      <h2>What the geometry means</h2>
      <ul>
        <li><strong>Center spine</strong> — each cuboid is one real block; width = block weight (up to 4 MWU), brightness = transaction count.</li>
        <li><strong>Fee tier rings</strong> — four horizontal arcs showing fee distribution by sat/vB tier.</li>
        <li><strong>Settlement ring</strong> — arc length tracks block production health (full circle = on-schedule 10-minute intervals).</li>
        <li><strong>Congestion ring</strong> — red arc, length scales with mempool pressure.</li>
        <li><strong>Volume ring</strong> — gold arc proportional to daily BTC transferred vs the 2021 ATH (~4.6M BTC/day).</li>
        <li><strong>Hashrate ring</strong> — vertical ring, arc length vs the ~1,305 EH/s peak.</li>
        <li><strong>Difficulty ring</strong> — log-scaled vertical ring from 1 to 150 trillion.</li>
        <li><strong>Floating particles</strong> — each particle ≈ 1,000 active addresses; larger = whale activity (100+ BTC outputs).</li>
      </ul>
      <h2>Data sources</h2>
      <ul>
        <li>Hashrate, active addresses, fees, block count: CoinMetrics (community tier).</li>
        <li>Difficulty, mempool depth: blockchain.com public charts.</li>
        <li>Per-block data, BTC transferred, whale outputs: Google BigQuery <code>crypto_bitcoin</code> dataset.</li>
      </ul>
      <p>
        Full source, methodology, and audit scripts at
        <a href="https://github.com/vyalya/bitcoin-data-driven-geometry">github.com/vyalya/bitcoin-data-driven-geometry</a>.
      </p>
      <p><strong>This site requires JavaScript and WebGL2 to render the 3D scene.</strong></p>
    </noscript>
